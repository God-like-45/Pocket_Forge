services:
  - type: web
    name: pocket-forge
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pocket-forge-db
          property: connectionString
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false

databases:
  - name: pocket-forge-db
    plan: free
    databaseName: pocketforge
    user: pocketforge_user
