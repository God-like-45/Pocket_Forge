<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketForge - AI Audio Dramas</title>
    <!-- Link to external premium CSS -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <header>
        <h1>PocketForge</h1>
        <p class="subtitle">AI-Powered Multi-Voice Audio Dramas</p>
    </header>

    <main>
        <div class="input-container">
            <textarea id="chapterText" placeholder="Paste your story chapter here... (e.g. Dr. Aris examined the core. Captain Vance entered, furious.)"></textarea>
        </div>
        
        <button class="btn-primary" id="generateBtn" onclick="generateAudio()">
            Generate Audio Drama
        </button>

        <div id="errorMsg" class="error-msg"></div>

        <div class="status-container" id="statusContainer">
            <div class="status-header">
                <div class="status-label">
                    <div class="pulsing-dot" id="pulsingDot"></div>
                    <span id="statusLabel">Initializing...</span>
                </div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="audio-section" id="audioSection">
            <div class="visualizer-container">
                <!-- Canvas for Web Audio API visualizer -->
                <canvas id="visualizerCanvas"></canvas>
            </div>
            <audio id="audioPlayer" controls crossorigin="anonymous"></audio>
            <audio id="bgmPlayer" loop style="display: none;"></audio>
        </div>
    </main>

    <!-- Link to external JS -->
    <script src="/static/app.js"></script>
</body>
</html>
